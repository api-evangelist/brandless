aid: brandless
name: Brandless
description: 'Brandless is an American direct-to-consumer e-commerce retailer of own-label
  food, beauty, personal care and household goods, founded in 2016 by Tina Sharkey and
  Ido Leffler and launched in July 2017. SoftBank-backed, it ceased operations on 10
  February 2020; its assets were bought in June 2020 by Clarke Capital Partners and
  Ikonifi and the brand relaunched that summer under Utah-based ownership, later led by
  Cydni Tetro and then Tiffany Vail. The storefront ran on Shopify and sold physical
  consumer packaged goods only — Brandless never operated a developer program, public
  API, SDK or webhook surface of its own. As of this profile the brandless.com domain no
  longer resolves and the site is parked, so there is no live company surface to profile.'
